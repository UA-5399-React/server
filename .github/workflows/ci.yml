name: server CI pipeline

on:
    push:
        branches: 
            - develop
            - feat\106-refactor-ci-pipeline-server
    pull_request:
        branches: 
            - develop

jobs:
    lint-and-format:
      name: Lint & Format check
      runs-on: ubuntu-latest

      steps: 
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9

            - name: Setup node 
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Eslint
              run: pnpm lint

            - name: Check formating
              run: pnpm prettier --check .
    test: 
        name: run app tests
        runs-on: ubuntu-latest
       
        steps: 
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9

            - name: Setup node 
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            
            - name: Run unit tests
              run: pnpm run test:cov

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: coverage-report
                path: coverage/
                retention-days: 7
    build:
        name: build app
        runs-on: ubuntu-latest
        needs: [lint-and-format, test]
        strategy:
            matrix:
                node-version: [20]

        steps: 
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9

            - name: Setup node 
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: pnpm       

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            
            - name: Build project
              run: pnpm run build 
