name: server CI pipeline

on:
    push:
        branches: 
            -develop
            - feat/58-server-ci-pipeline
    pull_request:
        branches: 
            -develop

jobs:
    test: 
        name: run app tests
        runs-on: ubuntu-latest

        steps: 
            - name: Checkout
              uses: actions/checkout@4

            - name: Setup node
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: pnpm

            - name: Install pnpm
              run: npm install -g pnpm
            
            - name: Install dependencies
              run: pnpm install
            
            - name: Run eslint
              run: pnpm run lint
            
            - name: Run unit tests
              run: pnpm run test:conv

            - name: Run e2e tests
              run: pnpm run test:e2e
    build:
        name: build app
        runs-on: ubuntu-latest

        steps: 
            - name: Checkout
              uses: actions/checkout@4

            - name: Setup node
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: pnpm
            - name: Install pnpm
              run: npm install -g pnpm
              
            - name: Install dependencies
              run: pnpm install 

            - name: Run format
              run: pnpm run format
            
            - name: Build project
              run: pnpm run build 
