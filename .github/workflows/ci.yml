name: server CI pipeline

on:
    push:
        branches: 
            - develop
            - feat/58-server-ci-pipeline
    pull_request:
        branches: 
            - develop

jobs:
    test: 
        name: run app tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20]

        steps: 
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9

            - name: Setup node ${{matrix.node-version}}
              uses: actions/setup-node@v4
              with: 
                node-version: ${{matrix.node-version}}
                cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            
            - name: Run eslint
              run: pnpm run lint
            
            - name: Run unit tests
              run: pnpm run test:cov
    build:
        name: build app
        runs-on: ubuntu-latest
        needs: test
        strategy:
            matrix:
                node-version: [20]

        steps: 
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9

            - name: Setup node ${{matrix.node-version}}
              uses: actions/setup-node@v4
              with: 
                node-version: ${{matrix.node-version}}
                cache: pnpm       

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run format
              run: pnpm run format
            
            - name: Build project
              run: pnpm run build 
